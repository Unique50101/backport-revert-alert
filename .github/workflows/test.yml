name: Tests and worked example
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test and render sample rollback
        run: node --test example.test.js
        env:
          WRITE_DEMO_SUMMARY: '1'
